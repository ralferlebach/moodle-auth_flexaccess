##############################################################################
# Moodle Plugin CI - main (release) pipeline - auth_flexaccess
#
# Runs ONLY on push / PR to main; provides the "CI complete" status check for
# branch protection. Full SEQUENTIAL pipeline per matrix cell across the
# supported Moodle 4.5/5.0/5.2/5.3 x PHP x DB matrix. PHP-only plugin: no grunt /
# mustache. The fast parallel pipeline lives in moodle-plugin-ci-dev.yml.
##############################################################################

name: Moodle Plugin CI Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  family:
    name: "Plugin family (exact commits)"
    runs-on: ubuntu-22.04
    outputs:
      lock: ${{ steps.resolve.outputs.lock }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - name: Self-test of the family resolver
        run: python3 plugin/.github/scripts/test_flexaccess_family.py
      - name: Pin the four plugins and tool_mergeusers to exact commits
        id: resolve
        # Resolves the "main" heads of the siblings ONCE to commit SHAs and requires every plugin at
        # this commit's version. The four repositories are uploaded one after another, so a sibling may
        # still be on the previous version for a few minutes: wait for it, then fail hard (no fallback).
        run: |
          python3 plugin/.github/scripts/flexaccess_family.py resolve \
            --self auth_flexaccess --self-dir plugin --self-sha "$GITHUB_SHA" --ref main --wait 1200 \
            --out family-lock.json --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the tested combination
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: flexaccess-family-lock
          path: family-lock.json
          if-no-files-found: ignore

  test:
    name: "CI / ${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.database }}"
    runs-on: ubuntu-22.04
    needs: [family]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3
      postgres17:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5433:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb114:
        image: mariadb:11.4
        env:
          MARIADB_USER: 'root'
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "true"
        ports:
          - 3307:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { moodle: MOODLE_405_STABLE, php: '8.1', database: pgsql, dbport: 5432 }
          - { moodle: MOODLE_405_STABLE, php: '8.1', database: mariadb, dbport: 3306 }
          - { moodle: MOODLE_405_STABLE, php: '8.2', database: pgsql, dbport: 5432 }
          - { moodle: MOODLE_405_STABLE, php: '8.3', database: mariadb, dbport: 3306 }
          - { moodle: MOODLE_500_STABLE, php: '8.2', database: pgsql, dbport: 5432 }
          - { moodle: MOODLE_500_STABLE, php: '8.3', database: mariadb, dbport: 3306 }
          - { moodle: MOODLE_500_STABLE, php: '8.4', database: mariadb, dbport: 3306 }
          - { moodle: MOODLE_502_STABLE, php: '8.3', database: pgsql, dbport: 5432 }
          - { moodle: MOODLE_502_STABLE, php: '8.3', database: mariadb, dbport: 3306 }
          - { moodle: MOODLE_502_STABLE, php: '8.4', database: pgsql, dbport: 5432 }
          - { moodle: MOODLE_503_STABLE, php: '8.3', database: pgsql, dbport: 5433 }
          - { moodle: MOODLE_503_STABLE, php: '8.3', database: mariadb, dbport: 3307 }
          - { moodle: MOODLE_503_STABLE, php: '8.4', database: pgsql, dbport: 5433 }
          - { moodle: MOODLE_503_STABLE, php: '8.4', database: mariadb, dbport: 3307 }
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin
      - name: Prepare log directory
        run: mkdir -p ci-logs
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ github.sha }}
          restore-keys: composer-${{ runner.os }}-
      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
      - name: Install Moodle, dependencies and plugin
        run: |
          # Exactly the commits pinned by the "family" job (no moving branches).
          python3 plugin/.github/scripts/flexaccess_family.py fetch --lock-json "$FAMILY_LOCK" \
            --self auth_flexaccess --dest moodle-plugin-ci-plugins --with-mergeusers
          # fetch writes the siblings to moodle-plugin-ci-plugins without add-plugin, so the directory
          # must be named explicitly - otherwise install silently installs the plugin under test alone.
          moodle-plugin-ci install --plugin ./plugin --extra-plugins=moodle-plugin-ci-plugins --db-host=127.0.0.1 --db-port=${{ matrix.dbport }}
          # The tested combination: exact commits of the family, Moodle, PHP and database versions.
          set -o pipefail; php plugin/.github/scripts/record_environment.php moodle --with-mergeusers | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          FAMILY_LOCK: ${{ needs.family.outputs.lock }}
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle }}
      - name: PHP Lint
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phplint 2>&1 | tee ci-logs/phplint.log
      - name: PHP Copy/Paste Detector
        continue-on-error: true
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpcpd 2>&1 | tee ci-logs/phpcpd.log
      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpmd 2>&1 | tee ci-logs/phpmd.log
      - name: Moodle Code Checker
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci codechecker --max-warnings 0 --exclude=PSR1.Classes.ClassDeclaration,moodle.Commenting.TodoComment 2>&1 | tee ci-logs/codechecker.log
      - name: Moodle PHPDoc Checker
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpdoc --max-warnings 0 2>&1 | tee ci-logs/phpdoc.log
      - name: Validating
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci validate 2>&1 | tee ci-logs/validate.log
      - name: Check upgrade savepoints
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci savepoints 2>&1 | tee ci-logs/savepoints.log
      - name: PHPUnit tests
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpunit --fail-on-warning --testdox 2>&1 | tee ci-logs/phpunit.log
      - name: Behat features
        id: behat
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci behat --profile chrome --tags "@auth_flexaccess&&~@broken" --dump 2>&1 | tee ci-logs/behat.log
      - name: Collect error summary
        if: ${{ always() }}
        run: |
          if [ -d "$GITHUB_WORKSPACE/moodledata/behat_dump" ]; then
            mkdir -p ci-logs/behat_dump
            cp -a "$GITHUB_WORKSPACE/moodledata/behat_dump/." ci-logs/behat_dump/
          fi
          {
            echo "job: ${{ github.job }} (${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.database }})"
            echo "status: ${{ job.status }}"
            echo "ref:    ${{ github.ref }}"
            echo ""
            ls -1 ci-logs
          } > ci-logs/summary.txt
          cat ci-logs/summary.txt
      - name: Upload error summary (ZIP)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: error-summary-main-${{ matrix.moodle }}-${{ matrix.php }}-${{ matrix.database }}
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload Behat screenshots (ZIP)
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: behat-screenshots-main-${{ matrix.moodle }}-${{ matrix.php }}-${{ matrix.database }}
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: warn

  release-artefact:
    name: Release artefact contents
    runs-on: ubuntu-22.04
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Build the release archive exactly as it will be distributed
        run: |
          # git archive is what honours .gitattributes export-ignore. Building the artefact here
          # means the gate tests the file set that is actually shipped, not the working tree.
          git archive --format=tar --prefix=flexaccess/ HEAD > /tmp/release.tar
          tar -tf /tmp/release.tar > /tmp/release.list
          echo "Artefakt enthält $(wc -l < /tmp/release.list) Einträge."

      - name: No developer tooling, CI plumbing or test harnesses may ship
        run: |
          rc=0
          while read -r forbidden; do
            if grep -qE "^flexaccess/${forbidden}" /tmp/release.list; then
              echo "VERBOTEN im Release-Artefakt: $forbidden"
              grep -E "^flexaccess/${forbidden}" /tmp/release.list | head -5
              rc=1
            fi
          done <<'PATTERNS'
          tools/
          docs/
          \.github/
          tests/load/
          tests/playwright/
          \.gitattributes
          \.gitignore
          makefile
          phpcs\.xml
          PATTERNS
          if [[ $rc -ne 0 ]]; then
            echo "Das Release-Artefakt darf keine Entwicklerwerkzeuge enthalten."
            exit 1
          fi
          echo "Artefakt ist sauber."

      - name: The artefact must still contain what Moodle runs
        run: |
          for required in flexaccess/version.php flexaccess/lang flexaccess/db; do
            if ! grep -q "^${required}" /tmp/release.list; then
              echo "FEHLT im Release-Artefakt: $required"
              exit 1
            fi
          done
          echo "Pflichtinhalte vorhanden."

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    needs: [family]
    services:
      postgres:
        image: postgres@sha256:6efd0df010dc3cb40d5e33e3ef84acecc5e73161bd3df06029ee8698e5e12c60
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP with a coverage driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pgsql, zip, gd, xmlrpc, soap, intl
          # pcov is enough for line coverage and far faster than xdebug.
          coverage: pcov
          ini-values: max_input_vars=5000

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist             moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle and the plugin ecosystem
        run: |
          # Exactly the commits pinned by the "family" job (no moving branches).
          python3 plugin/.github/scripts/flexaccess_family.py fetch --lock-json "$FAMILY_LOCK" \
            --self auth_flexaccess --dest moodle-plugin-ci-plugins
          # fetch writes the siblings to moodle-plugin-ci-plugins without add-plugin, so the directory
          # must be named explicitly - otherwise install silently installs the plugin under test alone.
          moodle-plugin-ci install --plugin ./plugin --extra-plugins=moodle-plugin-ci-plugins --db-host=127.0.0.1
          # The tested combination: exact commits of the family, Moodle, PHP and database versions.
          set -o pipefail; php plugin/.github/scripts/record_environment.php moodle | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          FAMILY_LOCK: ${{ needs.family.outputs.lock }}
          DB: pgsql
          MOODLE_BRANCH: MOODLE_405_STABLE

      - name: Run PHPUnit with coverage
        run: |
          # Clover XML instead of --coverage-text: the text report covers the whole Moodle tree
          # (its summary showed ~2% because it counts all of core), which says nothing about this
          # plugin. Clover gives per-file counters, so the gate can measure exactly this plugin.
          moodle-plugin-ci phpunit --coverage-clover --coverage-pcov ./plugin
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_405_STABLE

      - name: Enforce the coverage floor for this plugin
        run: |
          report=$(find . -name 'coverage.xml' -o -name 'clover.xml' | head -1)
          if [[ -z "$report" ]]; then
            echo "Kein Clover-Report gefunden - das Gate kann nicht bewertet werden."
            exit 1
          fi
          echo "Report: $report"
          # The gate measures THIS plugin only. Counting every path containing 'flexaccess' would
          # also include the three sibling plugins that are installed alongside but whose tests do
          # not run here - that produced a meaningless 0.5% and made the gate useless.
          php plugin/tools/coverage_gate.php "$report" "$COVERAGE_FLOOR"
        env:
          COVERAGE_FLOOR: '45'

  maturity-gate:
    name: Release gate
    needs: [family, test, release-artefact, coverage]
    runs-on: ubuntu-22.04
    # Without always() this job is skipped whenever one of its dependencies fails - and a skipped
    # job is not re-executed by "re-run failed jobs", so it stays skipped for good and keeps
    # ci-complete red even after every real failure has been fixed.
    if: always()
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Every release gate must be green
        run: |
          # This job is the single place where the release gates are judged, so it reports each
          # result and fails on any that is not green - whatever the declared maturity is.
          rc=0
          for entry in             "test=${{ needs.test.result }}"             "family=${{ needs.family.result }}"             "release-artefact=${{ needs.release-artefact.result }}"             "coverage=${{ needs.coverage.result }}"; do
            echo "  ${entry%%=*}: ${entry#*=}"
            if [[ "${entry#*=}" != "success" ]]; then
              rc=1
            fi
          done
          if [[ $rc -ne 0 ]]; then
            echo "Mindestens ein Release-Gate ist nicht gruen (siehe Liste oben)."
            exit 1
          fi
          maturity=$(grep -oE 'MATURITY_[A-Z]+' version.php | head -1)
          echo "Deklarierter Reifegrad: ${maturity:-unbekannt}"
          echo "Alle Release-Gates sind gruen."

  stale-files:
    name: Stale files
    runs-on: ubuntu-22.04
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Files removed in earlier releases must not still be present
        run: |
          # Unpacking a plugin ZIP adds and overwrites files but never deletes any, so a file
          # removed upstream survives in an installed copy or in a repository updated that way.
          # It then still autoloads, duplicates a class, or reads columns that no longer exist.
          # This job turns that into a loud failure instead of confusing downstream errors.
          list=db/removed_files.txt
          if [[ ! -f "$list" ]]; then
            echo "Keine Liste entfernter Dateien vorhanden - nichts zu pruefen."
            exit 0
          fi
          rc=0
          while IFS= read -r path; do
            [[ -z "$path" || "$path" == \#* ]] && continue
            if [[ -e "$path" ]]; then
              echo "Veraltete Datei ist noch vorhanden: $path"
              rc=1
            fi
          done < "$list"
          if [[ $rc -ne 0 ]]; then
            echo "Diese Dateien wurden in frueheren Releases entfernt und muessen geloescht werden."
            exit 1
          fi
          echo "Keine veralteten Dateien gefunden."

  ci-complete:
    name: CI complete
    needs: [maturity-gate, stale-files]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: All matrix jobs must have succeeded
        run: |
          # Every gate is named individually. The previous message printed only two of them, so a
          # failure in any other job looked like an unexplained red build.
          rc=0
          # Only the two aggregating jobs are evaluated here. The matrix, lockstep, artefact and
          # coverage results are judged once, inside maturity-gate; checking them here as well
          # duplicated the same condition in two places.
          for entry in             "maturity-gate=${{ needs.maturity-gate.result }}"             "stale-files=${{ needs.stale-files.result }}"; do
            name="${entry%%=*}"
            result="${entry#*=}"
            echo "  $name: $result"
            if [[ "$result" != "success" ]]; then
              rc=1
            fi
          done
          if [[ $rc -ne 0 ]]; then
            echo "Mindestens ein Gate ist nicht gruen (siehe Liste oben)."
            exit 1
          fi
          echo "All CI gates passed."
