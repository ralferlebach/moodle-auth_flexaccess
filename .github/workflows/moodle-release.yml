##############################################################################
# GitHub Actions Release CI - auth_flexaccess
#
# Runs on push / PR to main. Provides the "CI complete" status check for branch
# protection. PHP-only plugin: no JS bundle / AMD / Node steps.
##############################################################################
name: Moodle Plugin Release CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: true

env:
  MOODLE_CI: '^4'
  PGPASSWORD: moodle

jobs:
  ci:
    name: "CI / ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.db.engine }}"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { moodle-branch: MOODLE_405_STABLE, php: '8.1', db: { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle } }
          - { moodle-branch: MOODLE_405_STABLE, php: '8.2', db: { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root   } }
          - { moodle-branch: MOODLE_405_STABLE, php: '8.3', db: { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle } }
          - { moodle-branch: MOODLE_500_STABLE, php: '8.2', db: { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle } }
          - { moodle-branch: MOODLE_500_STABLE, php: '8.3', db: { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root   } }
          - { moodle-branch: MOODLE_502_STABLE, php: '8.3', db: { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle } }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER:     moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB:       postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, gd, intl, soap, mbstring, pdo_mysql, pdo_pgsql
          ini-values: max_input_vars=5000
          coverage: none
      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale
      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"
      - name: Install Moodle and plugin
        run: |
          moodle-plugin-ci install --plugin ./plugin \
            --db-host 127.0.0.1 --db-port ${{ matrix.db.port }} \
            --db-user ${{ matrix.db.user }} --db-pass ${{ matrix.db.pass }} --db-name moodle
        env:
          DB:            ${{ matrix.db.type }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
      - name: PHP Lint
        run: moodle-plugin-ci phplint
      - name: PHP Copy/Paste Detector
        run: moodle-plugin-ci phpcpd || true
      - name: Moodle Code Checker (PHPCS)
        run: moodle-plugin-ci phpcs --max-warnings 0
      - name: Moodle PHPDoc Checker
        run: moodle-plugin-ci phpdoc --max-warnings 0
      - name: Validate plugin structure
        run: moodle-plugin-ci validate
      - name: Check upgrade savepoints
        run: moodle-plugin-ci savepoints
      - name: Mustache lint
        run: moodle-plugin-ci mustache
      - name: PHPUnit
        run: moodle-plugin-ci phpunit --fail-on-warning
      - name: Behat
        run: moodle-plugin-ci behat --profile chrome --tags "@auth_flexaccess&&~@broken" --start-servers

  ci-complete:
    name: CI complete
    needs: [ci]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: All matrix jobs must have succeeded
        run: |
          if [[ "${{ needs.ci.result }}" == "success" ]]; then
            echo "All release CI jobs passed."
          else
            echo "CI result: ${{ needs.ci.result }} - one or more jobs failed or were cancelled."
            exit 1
          fi
