##############################################################################
# GitHub Actions CI - auth_flexaccess (development)
#
# Runs on push / PR to any branch EXCEPT main. PHP-only plugin: no JS bundle,
# AMD or Node build steps. Matrix: Moodle 4.5 / 5.0 / 5.2 x PHP x mariadb/pgsql.
##############################################################################
name: Moodle Plugin CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches-ignore:
      - main

env:
  MOODLE_CI: '^4'
  PGPASSWORD: moodle

jobs:
  # -- Static lint that needs no Moodle install ---------------------------
  lint-php:
    name: "PHP Lint / PHPCS - PHP ${{ matrix.php }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none
      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"
      - name: PHP Lint
        run: moodle-plugin-ci phplint plugin
      - name: PHP Code Sniffer (Moodle standard)
        run: moodle-plugin-ci phpcs plugin --max-warnings 0
      - name: PHP Mess Detector
        run: moodle-plugin-ci phpmd plugin || true

  # -- Lint that needs a Moodle checkout ----------------------------------
  lint-moodle:
    name: "PHPDoc / Mustache / Validate / Savepoints"
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none
      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale
      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"
      - name: Install Moodle (no test init)
        run: |
          moodle-plugin-ci install --plugin ./plugin --branch MOODLE_405_STABLE \
            --db-type mariadb --db-host 127.0.0.1 --db-port 3306 \
            --db-user root --db-pass root --db-name moodle --no-init
        env:
          DB: mariadb
          MOODLE_BRANCH: MOODLE_405_STABLE
      - name: PHPDoc check
        run: moodle-plugin-ci phpdoc --max-warnings 0
      - name: Mustache lint
        run: moodle-plugin-ci mustache
      - name: Validate plugin structure
        run: moodle-plugin-ci validate
      - name: Check upgrade savepoints
        run: moodle-plugin-ci savepoints

  # -- PHPUnit ------------------------------------------------------------
  phpunit:
    name: "PHPUnit (${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.db.engine }})"
    runs-on: ubuntu-24.04
    needs: [lint-php]
    strategy:
      fail-fast: false
      matrix:
        moodle: [MOODLE_405_STABLE, MOODLE_500_STABLE, MOODLE_502_STABLE]
        php: ['8.1', '8.2', '8.3']
        db:
          - { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root   }
          - { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle }
        exclude:
          - { moodle: MOODLE_500_STABLE, php: '8.1' }
          - { moodle: MOODLE_502_STABLE, php: '8.1' }
          - { moodle: MOODLE_502_STABLE, php: '8.2' }
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-retries=10
      pgsql:
        image: postgres:16
        env:
          POSTGRES_USER:     moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB:       postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U moodle"
          --health-interval=10s --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none
      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale
      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"
      - name: Install Moodle and plugin
        run: |
          moodle-plugin-ci install --plugin ./plugin \
            --db-host 127.0.0.1 --db-port ${{ matrix.db.port }} \
            --db-user ${{ matrix.db.user }} --db-pass ${{ matrix.db.pass }} --db-name moodle
        env:
          DB: ${{ matrix.db.type }}
          MOODLE_BRANCH: ${{ matrix.moodle }}
      - name: PHPUnit
        run: moodle-plugin-ci phpunit --fail-on-warning

  # -- Behat --------------------------------------------------------------
  behat:
    name: "Behat (${{ matrix.moodle }} / PHP ${{ matrix.php }})"
    runs-on: ubuntu-24.04
    needs: [lint-php, lint-moodle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { moodle: MOODLE_405_STABLE, php: '8.2' }
          - { moodle: MOODLE_500_STABLE, php: '8.2' }
          - { moodle: MOODLE_502_STABLE, php: '8.3' }
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none
      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale
      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"
      - name: Install Moodle and plugin
        run: |
          moodle-plugin-ci install --plugin ./plugin --branch ${{ matrix.moodle }} \
            --db-type mariadb --db-host 127.0.0.1 --db-port 3306 \
            --db-user root --db-pass root --db-name moodle
        env:
          DB: mariadb
          MOODLE_BRANCH: ${{ matrix.moodle }}
      - name: Behat
        run: moodle-plugin-ci behat --profile chrome --tags "@auth_flexaccess&&~@broken" --start-servers

  ci-complete:
    name: CI complete
    needs: [lint-php, lint-moodle, phpunit, behat]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: All jobs must have succeeded
        run: |
          r="${{ needs.lint-php.result }}-${{ needs.lint-moodle.result }}-${{ needs.phpunit.result }}-${{ needs.behat.result }}"
          if [[ "$r" == "success-success-success-success" ]]; then
            echo "All CI jobs passed."
          else
            echo "CI result: $r - one or more jobs failed or were cancelled."
            exit 1
          fi
